<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>개잼체스 1.0 Alpha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast"></div>

  <main id="lobby" class="screen card narrow">
    <h1>개잼체스 1.0 <small>ALPHA</small></h1>
    <p>14×14 · 중앙 육지 10×10 · 바다 2칸</p>
    <div class="stack">
      <button id="createRoom">온라인 방 만들기</button>
      <div class="joinrow">
        <input id="roomCode" maxlength="5" placeholder="방 코드">
        <button id="joinRoom">참가</button>
      </div>
      <button id="localTest" class="secondary">로컬 테스트</button>
    </div>
  </main>

  <section id="loadoutScreen" class="screen hidden">
    <div class="card loadoutbox">
      <div class="topline">
        <div>
          <h2>사용할 종류 6개 선택</h2>
          <p id="roomInfo" class="muted"></p>
        </div>
        <b id="loadoutCount">0 / 6</b>
      </div>
      <div id="loadoutChoices" class="loadout-grid"></div>
      <div class="topline bottomline">
        <span id="waiting" class="muted"></span>
        <button id="readyLoadout" disabled>준비 완료</button>
      </div>
    </div>
  </section>

  <section id="gameScreen" class="hidden">
    <header class="gamebar">
      <div>
        <h1>개잼체스</h1>
        <div id="status"></div>
      </div>
      <div class="toolbar">
        <button id="moveMode">이동</button>
        <button id="attackMode">공격</button>
        <button id="endAction" class="hidden">행동 종료</button>
        <button id="forgeMode">연성대</button>
        <button id="harborMode">항구 <span id="harborCount">0/3</span></button>
        <button id="princeMode">왕자 지정</button>
      </div>
    </header>

    <div class="game-layout">
      <div>
        <div id="board" aria-label="개잼체스 보드"></div>
        <div class="legend">
          <span>현재 구성:</span> <b id="turnLoadout"></b>
        </div>
      </div>

      <aside>
        <div id="sidePanel" class="panel"></div>

        <div id="forgePanel" class="panel hidden">
          <h3>연성대</h3>
          <p class="muted">연성대 모드에서 자기 기물을 클릭해 재료 선택.</p>
          <div id="forgeItems" class="forge-items">재료 없음</div>
          <div id="forgeResult" class="forge-result">결과: -</div>
          <div class="row">
            <button id="forgeCraft">연성하기</button>
            <button id="forgeReset" class="secondary">초기화</button>
          </div>
          <p class="muted">현재 알파: 연성 결과 배치 시 1턴 소모.</p>
        </div>

        <div class="panel">
          <h3>기록</h3>
          <div id="log"></div>
        </div>
      </aside>
    </div>
  </section>

  <script src="game.js"></script>
</body>
</html>
