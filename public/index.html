<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Chess</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div id="lobby">
        <h1>Custom Chess Online</h1>

        <div id="connectionStatus">
            서버 연결 중...
        </div>

        <!-- 진입 메뉴: 방 만들기 / 방 목록 -->
        <div id="lobbyMenu" class="lobby-view">
            <button id="menuCreateButton">방 만들기</button>
            <button id="menuListButton">방 목록</button>
        </div>

        <!-- 방 만들기 화면 -->
        <div id="lobbyCreate" class="lobby-view hidden">
            <input
                id="createNameInput"
                type="text"
                placeholder="방 이름"
                autocomplete="off"
            >
            <input
                id="createPasswordInput"
                type="password"
                placeholder="비밀번호 (선택 사항)"
                autocomplete="off"
            >
            <button id="createRoomButton">방 만들기</button>
            <button id="createBackButton" class="lobby-back-button">메뉴로 돌아가기</button>
        </div>

        <!-- 방 목록 화면 -->
        <div id="lobbyList" class="lobby-view hidden">
            <div class="lobby-list-layout">
                <button id="listBackButton" class="lobby-back-button">메뉴로 돌아가기</button>
                <div class="lobby-list-main">
                    <button id="refreshRoomsButton">새로고침</button>
                    <div id="roomList" class="room-list">
                        <div class="room-list-empty">방이 없습니다.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div id="game" class="hidden">

        <div id="roomInfo"></div>

        <div class="game-layout">

            <div class="left-panel">
                <button id="forgeButton" class="hidden" title="연성대 (기물 합성)">
                    <span class="forge-btn-grid">
                        <span class="forge-btn-cell"></span><span class="forge-btn-cell"></span><span class="forge-btn-cell"></span>
                        <span class="forge-btn-cell"></span><span class="forge-btn-cell"></span><span class="forge-btn-cell"></span>
                        <span class="forge-btn-cell"></span><span class="forge-btn-cell"></span><span class="forge-btn-cell"></span>
                    </span>
                    <span class="forge-btn-label">연성대</span>
                </button>
            </div>

            <div class="board-container">
                <div id="board"></div>
            </div>


            <aside class="game-info">

                <div class="players">

                    <div
                        id="whitePlayer"
                        class="player"
                    >
                        <span>백</span>
                        <span id="whiteTimer">--:--</span>
                        <b id="whiteScore">0점</b>
                    </div>

                    <div
                        id="blackPlayer"
                        class="player"
                    >
                        <span>흑</span>
                        <span id="blackTimer">--:--</span>
                        <b id="blackScore">0점</b>
                    </div>

                </div>


                <div id="status">
                    대기 중...
                </div>

                <div id="moveCounter">전체 수: 0</div>

                <button id="colossusButton" class="hidden">거신병 소환</button>

                <button id="restartButton">
                    다시 시작
                </button>


                <div class="moves">
                    <h3>기보</h3>
                    <div id="moveList"></div>
                </div>

            </aside>

        </div>

    </div>

    <div id="promotionModal" class="promotion-modal hidden">
        <div class="promotion-box">
            <h2>프로모션</h2>
            <p>원하는 기물을 선택</p>
            <div class="promotion-options">
                <button data-piece="queen">♕<span>퀸</span></button>
                <button data-piece="rook">♖<span>룩</span></button>
                <button data-piece="bishop">♗<span>비숍</span></button>
                <button data-piece="knight">♘<span>나이트</span></button>
            </div>
        </div>
    </div>

    <div id="forgeModal" class="promotion-modal hidden">
        <div class="promotion-box">
            <h2>연성대</h2>
            <p>제작대처럼 3*3칸 안에서 조합을 선택하세요</p>
            <div id="forgeOptions" class="forge-options"></div>
            <button id="forgeCancel" class="forge-cancel">취소</button>
        </div>
    </div>

    <script src="/game.js?v=8"></script>

</body>
</html>
