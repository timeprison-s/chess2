<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Chess</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div id="lobby">
        <h1>Custom Chess Online</h1>

        <div id="connectionStatus">
            서버 연결 중...
        </div>

        <div class="room-controls">
            <input
                id="roomInput"
                type="text"
                placeholder="방 코드"
                autocomplete="off"
            >

            <button id="joinButton">
                방 참가
            </button>
        </div>
    </div>


    <div id="game" class="hidden">

        <div id="roomInfo"></div>

        <div class="game-layout">

            <div class="board-container">
                <div id="board"></div>
            </div>


            <aside class="game-info">

                <div class="players">

                    <div
                        id="whitePlayer"
                        class="player"
                    >
                        <span>백</span>
                        <span id="whiteTimer">--:--</span>
                        <b id="whiteScore">0점</b>
                    </div>

                    <div
                        id="blackPlayer"
                        class="player"
                    >
                        <span>흑</span>
                        <span id="blackTimer">--:--</span>
                        <b id="blackScore">0점</b>
                    </div>

                </div>


                <div id="status">
                    대기 중...
                </div>

                <div id="moveCounter">전체 수: 0</div>

                <button id="colossusButton" class="hidden">거신병 소환</button>

                <button id="restartButton">
                    다시 시작
                </button>

                <div class="help">좌클릭: 이동/처치 (자신의 기물도 가능)<br>우클릭: 합체<br>G: 폰에 총 장착<br>킹을 두 칸 이동: 캐슬링<br>30수 이후 기물 희생으로 거신병 소환 가능</div>

                <div class="moves">
                    <h3>기보</h3>
                    <div id="moveList"></div>
                </div>

            </aside>

        </div>

    </div>

    <div id="promotionModal" class="promotion-modal hidden">
        <div class="promotion-box">
            <h2>프로모션</h2>
            <p>원하는 기물을 선택</p>
            <div class="promotion-options">
                <button data-piece="queen">♕<span>퀸</span></button>
                <button data-piece="rook">♖<span>룩</span></button>
                <button data-piece="bishop">♗<span>비숍</span></button>
                <button data-piece="knight">♘<span>나이트</span></button>
            </div>
        </div>
    </div>

    <script src="/game.js?v=5"></script>

</body>
</html>
