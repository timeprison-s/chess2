<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>개잼체스</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="lobby"><h1>개잼체스</h1><div id="connectionStatus">서버 연결 중...</div><div class="room-controls"><input id="roomInput" type="text" placeholder="방 코드" autocomplete="off"><button id="joinButton">방 참가</button></div></div>
<div id="game" class="hidden"><div id="roomInfo"></div><div class="game-layout"><div class="board-container"><div id="board"></div></div><aside class="game-info"><div class="players"><div id="whitePlayer" class="player"><span>백</span><span id="whiteTimer">--:--</span><b id="whiteScore">0점</b></div><div id="blackPlayer" class="player"><span>흑</span><span id="blackTimer">--:--</span><b id="blackScore">0점</b></div></div><div id="status">대기 중...</div><div id="moveCounter">전체 수: 0</div><button id="colossusButton" class="hidden">체크메이트의 거신병 소환</button><button id="restartButton" class="hidden">다시 시작</button><div class="help">좌클릭: 이동/잡기<br>우클릭: 합체<br>G: 폰에 총 장착</div><div class="moves"><h3>기보</h3><div id="moveList"></div></div></aside></div></div><script src="/game.js"></script></body></html>
