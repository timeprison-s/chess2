<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050506">
  <title>개잼체스 Alpha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div id="toast"></div>

  <!-- 메인 -->
  <main id="mainScreen" class="app-screen menu-screen">
    <section class="menu-card glass">
      <div class="menu-kicker">GAEJAM CHESS · ALPHA</div>
      <button id="openRoomList" class="menu-button">방 목록</button>
      <button id="openCreateRoom" class="menu-button">방 만들기</button>
      <button id="localTest" class="text-button">로컬 테스트</button>
    </section>

    <div class="brand-corner">
      <strong>개잼체스</strong>
      <span id="networkText">서버 연결 중</span>
    </div>
  </main>

  <!-- 방 목록 -->
  <section id="roomBrowserScreen" class="app-screen hidden center-screen">
    <div class="browser-window glass">
      <header class="window-head">
        <button id="roomListBack" class="back-button">←</button>
        <div>
          <span class="section-label">ONLINE</span>
          <h1>방 목록</h1>
        </div>
        <button id="refreshRooms" class="small-button">새로고침</button>
      </header>

      <div class="browser-body">
        <div id="roomList" class="room-column"></div>

        <div id="roomDetails" class="room-detail">
          <div class="empty-detail">
            왼쪽에서 방을 선택.
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 방 만들기 -->
  <section id="createRoomScreen" class="app-screen hidden center-screen">
    <div class="create-window glass">
      <header class="window-head">
        <button id="createBack" class="back-button">←</button>
        <div>
          <span class="section-label">NEW ROOM</span>
          <h1>방 만들기</h1>
        </div>
      </header>

      <div class="create-form">
        <label>
          <span>방 이름</span>
          <input id="createRoomName" maxlength="24" placeholder="개잼체스 방">
        </label>

        <label>
          <span>비밀번호</span>
          <input id="createRoomPassword" maxlength="32" type="password" placeholder="비워두면 공개방">
        </label>

        <div class="form-actions">
          <button id="cancelCreate" class="secondary-button">취소</button>
          <button id="confirmCreate" class="primary-button">만들기</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 대기실 -->
  <section id="waitingRoomScreen" class="app-screen hidden center-screen">
    <div class="waiting-window glass">
      <header class="window-head">
        <button id="leaveRoom" class="back-button">←</button>
        <div>
          <span class="section-label">WAITING ROOM</span>
          <h1 id="waitingRoomName">방</h1>
          <p id="waitingRoomCode" class="subtext"></p>
        </div>
      </header>

      <div id="waitingPlayers" class="waiting-players"></div>

      <div class="spectator-box">
        <span>관전</span>
        <div>관전자 없음</div>
      </div>

      <div class="waiting-footer">
        <span id="waitingHint">상대 입장을 기다리는 중…</span>
        <button id="readyButton" class="primary-button">준비</button>
      </div>
    </div>
  </section>

  <!-- 6종 선택 -->
  <section id="loadoutScreen" class="app-screen hidden center-screen">
    <div class="loadout-window glass">
      <header class="loadout-head">
        <div>
          <span class="section-label">SELECT</span>
          <h1>사용할 기물 종류 선택</h1>
          <p id="roomInfo" class="subtext"></p>
        </div>
        <strong id="loadoutCount">0 / 6</strong>
      </header>

      <div id="loadoutChoices" class="loadout-grid"></div>

      <footer class="loadout-footer">
        <span id="waiting" class="subtext"></span>
        <button id="readyLoadout" class="primary-button" disabled>선택 완료</button>
      </footer>
    </div>
  </section>

  <!-- 게임 -->
  <section id="gameScreen" class="app-screen hidden game-screen">
    <div class="game-shell">
      <aside class="left-rail">
        <section class="forge-box glass">
          <div class="rail-title">연성대</div>
          <div class="forge-diagram">
            <div id="forgeSlots" class="forge-slots">
              <div></div><div></div><div></div>
              <div></div><div></div><div></div>
              <div></div><div></div><div></div>
            </div>
            <div class="forge-arrow">↓</div>
            <div id="forgeOutput" class="forge-output">?</div>
          </div>
          <div id="forgeItems" class="forge-items">재료 없음</div>
          <div id="forgeResult" class="forge-result">결과: -</div>
          <div class="rail-actions">
            <button id="forgeCraft">연성</button>
            <button id="forgeReset">초기화</button>
          </div>
        </section>

        <section id="sidePanel" class="piece-box glass"></section>
      </aside>

      <main class="board-zone">
        <div class="board-topbar glass">
          <div id="status">게임 준비 중</div>
          <div id="turnLoadout"></div>
        </div>
        <div id="board" aria-label="개잼체스 보드"></div>
      </main>

      <aside class="right-rail">
        <section class="players-box glass">
          <div class="rail-title">PLAYER</div>
          <div id="gamePlayers"></div>
        </section>

        <section class="notation-box glass">
          <div class="rail-title">기보</div>
          <div id="log"></div>
        </section>

        <section class="control-box glass">
          <div class="control-grid">
            <button id="moveMode">이동</button>
            <button id="attackMode">공격</button>
            <button id="endAction" class="hidden">행동 종료</button>
            <button id="harborMode">항구 <span id="harborCount">0/3</span></button>
            <button id="princeMode">왕자 지정</button>
            <button id="forgeMode">연성 선택</button>
          </div>
          <div class="bottom-actions">
            <button id="resignButton" class="danger-button">기권</button>
            <button id="forgeFocusButton" class="primary-button">연성대</button>
          </div>
        </section>
      </aside>
    </div>
  </section>

  <script src="game.js"></script>
</body>
</html>
